version: '3.8'

services:
  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ssp-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      # Load from backend/.env file
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY=${JWT_EXPIRY}
      - CORS_ORIGIN=http://localhost:3000
    env_file:
      - ./backend/.env
    depends_on:
      frontend:
        condition: service_started
    networks:
      - ssp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE=http://backend:5000/api
    container_name: ssp-frontend
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE=http://localhost:5000/api
    env_file:
      - ./frontend/.env
    networks:
      - ssp-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  ssp-network:
    driver: bridge

volumes:
  # No MongoDB volume needed since using Atlas
